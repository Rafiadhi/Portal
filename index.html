<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koleksi Kartu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--cream:#e9e9e7;--or:#f2593a;--mut:#8b8b88;--tx:#f1f1ef;--fd:"Archivo Black","Arial Black",sans-serif;--fm:"Space Mono",ui-monospace,Menlo,monospace;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100dvh;overflow:hidden;overscroll-behavior:none}
body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 0,#2a1208,transparent 60%),radial-gradient(#ffffff10 1px,transparent 1.3px) 0 0/6px 6px,var(--bg);color:var(--tx);font:400 14px/1.5 var(--fm)}
:focus-visible{outline:2px solid var(--or);outline-offset:3px}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px 14px}
.w{width:min(460px,100%)}

.strip{display:flex;align-items:center;gap:12px;height:50px;padding:0 16px;background:#000;border:3px solid var(--cream);border-radius:17px;box-shadow:0 10px 30px #000a}
.strip:focus-within{box-shadow:0 0 0 3px #f2593a66}
.strip svg{width:16px;height:16px;flex:none;fill:var(--or)}
.strip input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:700 13px var(--fm)}
.strip input::placeholder{color:#6d6d6a}
.cnt{font-size:12px;color:#cfcfcc;white-space:nowrap}
.meter{display:flex;gap:2px}
.meter i{width:4px;height:12px;border-radius:1px;background:#333}
.meter i.on{background:#ddd}
.led{width:8px;height:8px;border-radius:50%;background:#e5322d;box-shadow:0 0 8px #e5322d;flex:none}

.device{position:relative;padding:12px;border-radius:30px;background:linear-gradient(#f0f0ee,#dcdcda);box-shadow:inset 0 2px 0 #fff,inset 0 -3px 0 #0002,0 30px 70px #000c,0 0 0 1px #0006}
.grille{height:30px;margin:2px 8px 10px;background:radial-gradient(circle,#2a2a2a 1.2px,transparent 1.7px) 0 0/7px 7px}
.grille.sm{height:20px}
.screen{background:#000;border-radius:14px;padding:20px 14px 14px;box-shadow:0 0 0 3px #111,inset 0 0 0 1px #222}
.frame{position:relative;border:1px solid var(--or);border-radius:9px;padding:6px 0 4px}
.frame::before{content:attr(data-t);position:absolute;top:-8px;left:14px;padding:0 6px;background:#000;color:var(--or);font-size:10px;line-height:1}
.frame.pad{padding:22px 14px 14px}
.stage{--sh:clamp(200px,calc(100dvh - 320px),440px);position:relative;height:var(--sh);perspective:1000px;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage.drag{cursor:grabbing}
.none{position:absolute;inset:0;display:grid;place-content:center;margin:0;text-align:center;color:var(--mut);font-size:12px}

.card{position:absolute;left:50%;top:50%;display:block;height:calc(var(--sh)*.9);width:calc(var(--sh)*.6);container-type:inline-size;border-radius:calc(var(--sh)*.06);background:var(--c);color:var(--ink);text-decoration:none;will-change:transform;-webkit-user-drag:none}
.in{position:relative;height:100%;padding:5cqw;display:flex;flex-direction:column}
.lvl{position:absolute;z-index:2;top:5cqw;left:5cqw;width:56%;padding:2.2cqw 4cqw 2cqw 0;background:var(--c);clip-path:polygon(0 0,100% 0,100% 45%,90% 100%,0 100%)}
.bar{display:block;height:3.4cqw;border-radius:1cqw;overflow:hidden;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(115deg,var(--ink) 0 3.2cqw,transparent 3.2cqw 4.6cqw)}
.lvl b{display:block;margin-top:1.8cqw;font:700 5cqw/1.2 var(--fm)}
.pic{position:relative;flex:1;min-height:0;margin-top:9cqw;border-radius:6cqw;background:linear-gradient(var(--c2),var(--c3));display:grid;place-items:center;font-size:38cqw;line-height:1;overflow:hidden}
.pic::before{content:"";position:absolute;inset:0;background:radial-gradient(#0000002e 1px,transparent 1.4px) 0 0/4px 4px}
.pic>*{position:relative}
.pic img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.meta{display:flex;justify-content:space-between;margin-top:5cqw;font:700 5.2cqw/1.2 var(--fm)}
h3{margin:1.5cqw 0 0;font:400 15cqw/1.1 var(--fd);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:3cqw}
.ics{display:flex;gap:2.5cqw}
.ic{display:grid;place-items:center;width:15cqw;height:10cqw;border:.7cqw solid var(--ink);border-radius:99px}
.ic svg,.go svg{width:6.5cqw;height:6.5cqw;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.go{display:grid;place-items:center;width:12cqw;height:12cqw;border:.8cqw solid var(--ink);border-radius:3.5cqw}
.go svg{width:7.5cqw;height:7.5cqw}

.keys{display:grid;grid-template-columns:72px 1fr 1.55fr;gap:4px;height:92px;margin-top:8px;padding:4px;background:#101010;border-radius:16px}
.kc{display:grid;grid-template-rows:1fr 1fr;gap:4px}
.key{position:relative;display:grid;place-items:center;padding:0;border:0;border-radius:12px;background:#ececea;color:#b3b3b0;font:700 17px var(--fm);cursor:pointer}
.key.big::before{content:"";position:absolute;inset:12px;border-radius:999px;background:linear-gradient(#e6e6e4,#f3f3f1);box-shadow:inset 0 3px 8px #0002,0 1px 0 #fff}
.key.big span{position:relative}
.key:active{transform:translateY(1px);filter:brightness(.95)}
.key.sm{align-content:end;padding-bottom:4px;border-radius:8px;font-size:11px}
.key.or{align-content:center;padding:0;background:var(--or);color:#fff;font-size:24px}
.key .led{position:absolute;top:6px;right:6px;width:5px;height:5px;background:#3a3a3a;box-shadow:none}
.key.live .led{background:#2dd36f;box-shadow:0 0 6px #2dd36f}
.key:disabled{opacity:.55;cursor:default}

dialog{padding:0;border:0;background:none;color:var(--tx);overflow:visible;max-width:none}
dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}
dialog[open]{animation:pop .42s cubic-bezier(.2,.9,.25,1.08)}
dialog[open]::backdrop{animation:fade .35s ease}
dialog.out{animation:popout .22s ease-in forwards}
dialog.out::backdrop{animation:fadeout .22s ease-in forwards}
@keyframes pop{from{opacity:0;transform:translateY(28px) scale(.92)}to{opacity:1;transform:none}}
@keyframes popout{to{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@media(prefers-reduced-motion:reduce){dialog,dialog::backdrop{animation:none!important}}
dialog .device{width:min(460px,94vw);max-height:94dvh;overflow:auto}
.fld{display:grid;grid-template-columns:116px 1fr;gap:16px}
.drop{position:relative;display:grid;place-items:center;aspect-ratio:2/3;border:2px dashed var(--or);border-radius:14px;background:#0c0c0c;color:var(--or);font-size:11px;text-align:center;cursor:pointer;overflow:hidden}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.drop input{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer}
.t{display:block;margin:0 0 4px;color:var(--mut);font-size:11px}
.t::before{content:"> ";color:var(--or)}
.f{width:100%;margin-bottom:14px;padding:11px 12px;background:#0c0c0c;border:1px solid #333;border-radius:6px;outline:0;color:var(--tx);font:700 13px var(--fm)}
.f:focus{border-color:var(--or)}
.msg{min-height:1.5em;margin:14px 0 8px;color:var(--mut);font-size:12px}
.msg.err{color:#ff7a5c}
.btns{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.submit{height:50px;border:0;border-radius:12px;background:var(--or);color:#fff;font:700 14px var(--fm);cursor:pointer;box-shadow:inset 0 -4px 0 #0003}
.submit.alt{background:#d8d8d6;color:#555}
.submit:active{transform:translateY(1px)}
.rows{max-height:34dvh;overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:0 0 6px;border-bottom:1px solid #333;color:var(--mut);font-weight:400;text-align:left}
.tbl td{padding:6px 4px 6px 0}
.tbl td:first-child{width:24px;color:var(--or)}
.tbl .f{margin:0;padding:9px 10px}
.rm,.mini{border:1px solid #333;border-radius:6px;background:#0c0c0c;color:var(--mut);font:700 12px var(--fm);cursor:pointer}
.rm{width:34px;height:34px}
.mini{margin-top:10px;padding:8px 12px;color:var(--or)}
.rm:hover,.mini:hover{border-color:var(--or);color:var(--or)}

.toast{position:fixed;z-index:99;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:min(92vw,420px);padding:10px 16px;background:#000;border:2px solid var(--cream);border-radius:12px;font-size:12px;text-align:center;opacity:0;transform:translate(-50%,20px);pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:var(--or)}
@media(max-width:480px){.meter{display:none}.fld{grid-template-columns:96px 1fr}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 7h14M5 17h14"/></symbol>
  <symbol id="i-bar" viewBox="0 0 24 24"><path d="M4 5v14M7 5v14M13 5v14M20 5v14"/><path d="M10 5v14M16.5 5v14" stroke-width="3.4"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
</svg>

<main class="app">
  <label class="strip w">
    <svg viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 0h4v1H2zM1 1h1v1H1zM6 1h1v1H6zM0 2h1v4H0zM7 2h1v4H7zM1 6h1v1H1zM6 6h1v1H6zM2 7h4v1H2zM7 7h1v1H7zM8 8h1v1H8z"/></svg>
    <input id="q" type="search" placeholder="Cari kartu…" autocomplete="off" aria-label="Cari kartu">
    <span class="cnt" id="cnt">0/0</span>
    <span class="meter" id="meter" aria-hidden="true"></span>
    <i class="led"></i>
  </label>

  <div class="device w" id="device">
    <div class="grille"></div>
    <div class="screen">
      <div class="frame" data-t="KOLEKSI v1.0"><div class="stage" id="stage"></div></div>
    </div>
    <div class="keys">
      <div class="kc">
        <button class="key sm" id="auto" type="button" title="Klik: buka semua tab · Klik kanan: atur link"><i class="led"></i>Auto</button>
        <button class="key sm or" id="add" type="button" aria-label="Tambah kartu" title="Tambah kartu">+</button>
      </div>
      <button class="key big" id="del" type="button"><span>Hapus</span></button>
      <button class="key big" id="open" type="button"><span>Buka</span></button>
    </div>
  </div>
</main>

<dialog id="dAdd">
  <form class="device" id="form" novalidate>
    <div class="grille sm"></div>
    <div class="screen">
      <div class="frame pad" data-t="TAMBAH KARTU">
        <div class="fld">
          <label class="drop" id="drop"><span id="dt">+ gambar</span><img id="pv" alt="" hidden><input id="file" type="file" accept="image/*"></label>
          <div>
            <label class="t" for="nm">nama</label>
            <input class="f" id="nm" maxlength="40" autocomplete="off" placeholder="mis. Ducky">
            <label class="t" for="ln">link tujuan</label>
            <input class="f" id="ln" inputmode="url" autocomplete="off" placeholder="https://contoh.com">
          </div>
        </div>
      </div>
      <p class="msg" id="msg" role="status">Warna kartu diambil dari gambar yang kamu pilih.</p>
      <div class="btns"><button class="submit alt" type="button" data-close>Batal</button><button class="submit" type="submit">Tambah kartu</button></div>
    </div>
  </form>
</dialog>

<dialog id="dAuto">
  <form class="device" id="fA" novalidate>
    <div class="grille sm"></div>
    <div class="screen">
      <div class="frame pad" data-t="LINK AUTO">
        <div class="rows"><table class="tbl"><thead><tr><th>#</th><th>link</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
        <button class="mini" id="addRow" type="button">+ tambah baris</button>
      </div>
      <p class="msg" id="msgA" role="status"></p>
      <div class="btns"><button class="submit alt" type="button" data-close>Tutup</button><button class="submit" type="submit">Simpan</button></div>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safe=u=>/^https?:\/\//i.test(u)?u:"#";
const normUrl=v=>{v=v.trim();if(!v)return"";if(!/^https?:\/\//i.test(v))v="https://"+v;try{return new URL(v).href}catch(_){return null}};
const rd=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:f}catch(_){return f}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}};
let tT;
function toast(t,err,ms){const e=$("#toast");e.textContent=t;e.classList.toggle("err",!!err);e.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("show"),ms||3400)}

/* Warna kartu diambil dari warna dominan gambar */
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}return{h,s,l}}
function hsl2rgb(h,s,l){const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0),f(8),f(4)]}
function dominant(im){
  const S=48,c=document.createElement("canvas");c.width=c.height=S;
  const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0,S,S);
  const px=x.getImageData(0,0,S,S).data,b={};
  for(let i=0;i<px.length;i+=4){
    if(px[i+3]<128)continue;
    const r=px[i],g=px[i+1],bl=px[i+2],mx=Math.max(r,g,bl),mn=Math.min(r,g,bl);
    const l=(mx+mn)/510,s=mx===mn?0:(mx-mn)/(255-Math.abs(mx+mn-255));
    const w=(.1+s)*(l<.12||l>.93?.15:1),k=(r>>5)<<6|(g>>5)<<3|(bl>>5);
    const o=b[k]||(b[k]={w:0,r:0,g:0,b:0});
    o.w+=w;o.r+=r*w;o.g+=g*w;o.b+=bl*w;
  }
  let best=null;
  for(const k in b)if(!best||b[k].w>best.w)best=b[k];
  return best?rgb2hsl(best.r/best.w,best.g/best.w,best.b/best.w):null;
}
function theme({h,s,l}){
  const s2=s<.12?s:clamp(s,.55,.95),l2=clamp(l,.44,.64),lin=v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4;
  const [r,g,b]=hsl2rgb(h,s2,l2),L=.2126*lin(r)+.7152*lin(g)+.0722*lin(b),p=v=>Math.round(v*100)+"%",H=Math.round(h);
  return{c:`hsl(${H} ${p(s2)} ${p(l2)})`,c2:`hsl(${H} ${p(s2)} ${p(l2-.04)})`,c3:`hsl(${(H+348)%360} ${p(Math.min(1,s2+.05))} ${p(Math.max(.12,l2-.17))})`,ink:L>.19?`hsl(${H} ${p(Math.min(s2,.5))} 7%)`:`hsl(${H} 30% 96%)`};
}
const hue=n=>[...n].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%360;

/* Data kartu: tersimpan di browser ini */
const KEY="koleksi-kartu-v1",AK="koleksi-auto-v1";
const seed=[["Ducky","🐥",48],["Foxy","🦊",22],["Robo","🤖",205],["Draco","🐲",150],["Panda","🐼",280]].map(([n,e,h],i)=>({id:"s"+i,n,e,u:"https://example.com",th:theme({h,s:.9,l:.58})}));
let all=rd(KEY,seed),autoLinks=rd(AK,[]);
const save=()=>wr(KEY,all);

const card=(d,i,n)=>{
  const p=String(i+1).padStart(4,"0"),t=d.th||theme({h:hue(d.n),s:.85,l:.58});
  return `<a class="card" style="--c:${esc(t.c)};--c2:${esc(t.c2)};--c3:${esc(t.c3)};--ink:${esc(t.ink)}" href="${esc(safe(d.u))}" target="_blank" rel="noopener" draggable="false" aria-label="${esc(d.n)}"><div class="in"><div class="lvl"><span class="bar"><i style="width:${Math.round((i+1)/n*100)}%"></i></span><b>LVL ${p}</b></div><div class="pic">${d.img?`<img src="${esc(d.img)}" alt="" draggable="false">`:`<span>${d.e||"🎴"}</span>`}</div><div class="meta"><span>KOLEKSI • #${p}</span><span>${i+1}/${n}</span></div><h3>${esc(d.n)}</h3><div class="foot"><div class="ics"><span class="ic"><svg><use href="#i-globe"/></svg></span><span class="ic"><svg><use href="#i-bar"/></svg></span><span class="ic"><svg><use href="#i-link"/></svg></span></div><span class="go"><svg><use href="#i-out"/></svg></span></div></div></a>`;
};

/* Carousel */
const stage=$("#stage"),q=$("#q");
$("#meter").innerHTML="<i></i>".repeat(10);
const meter=[...document.querySelectorAll("#meter i")];
let shown=all,pos=0,tpos=0,raf=0,drag=null,snapT,dir=0,lastAct=-1,swiped=false,delT,lpT,lpFired=false;
const els=()=>[...stage.querySelectorAll(".card")];
const cur=()=>clamp(Math.round(tpos),0,Math.max(0,shown.length-1));

function status(k){
  const d=shown[k];
  $("#cnt").textContent=shown.length?`${k+1}/${shown.length}`:"0/0";
  els().forEach((e,i)=>{e.tabIndex=i===k?0:-1});
  $("#open").disabled=$("#del").disabled=!d;
}
function render(){
  const n=shown.length;
  els().forEach((el,i)=>{
    const o=i-pos,a=Math.abs(o);
    if(a>3.2){el.style.visibility="hidden";return}
    el.style.visibility="";
    el.style.transform=`translate(-50%,-50%) translateX(${o*76}%) translateZ(${-Math.min(a,2)*70}px) rotateY(${-clamp(o,-1,1)*32}deg) scale(${1-Math.min(a,2)*.08})`;
    el.style.zIndex=50-Math.round(a*10);
    el.style.filter=`brightness(${1-Math.min(a,1)*.45})`;
  });
  const k=clamp(Math.round(pos),0,Math.max(0,n-1));
  if(k!==lastAct){lastAct=k;status(k)}
  const lit=n>1?Math.round(clamp(pos/(n-1),0,1)*9):0;
  meter.forEach((m,i)=>m.classList.toggle("on",n>0&&i<=lit));
}
function loop(){
  raf=0;
  const d=tpos-pos;
  pos+=Math.abs(d)<.0005?d:d*(drag&&drag.m?.38:.14);
  render();
  if(Math.abs(tpos-pos)>.0005)kick();
}
function kick(){if(!raf)raf=requestAnimationFrame(loop)}
function build(){
  stage.querySelectorAll(".card,.none").forEach(n=>n.remove());
  const n=shown.length;
  stage.insertAdjacentHTML("afterbegin",n?shown.map((d,i)=>card(d,i,n)).join(""):'<p class="none">Tidak ada kartu.<br>Tambahkan lewat tombol + di bawah.</p>');
  pos=tpos=0;lastAct=-1;render();
}
function applyFilter(idx){
  const k=q.value.trim().toLowerCase();
  shown=all.filter(d=>d.n.toLowerCase().includes(k));
  build();
  if(idx!=null){pos=tpos=clamp(idx,0,Math.max(0,shown.length-1));kick()}
}
const go=d=>{tpos=clamp(cur()+d,0,Math.max(0,shown.length-1));kick()};
function wheelStep(dy){
  const n=shown.length;
  tpos=clamp(tpos+dy/200,0,n-1);dir=Math.sign(dy);
  clearTimeout(snapT);
  snapT=setTimeout(()=>{tpos=clamp(dir>0?Math.ceil(tpos-.08):Math.floor(tpos+.08),0,n-1);kick()},120);
  kick();
}
/* Halaman tidak bisa di-scroll; scroll hanya berfungsi di dalam kotak perangkat */
addEventListener("wheel",e=>{
  if(e.ctrlKey||e.target.closest("dialog"))return;
  e.preventDefault();
  if(!shown.length||!e.target.closest("#device"))return;
  const d=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;
  wheelStep(e.deltaMode?d*32:d);
},{passive:false});

const sp=()=>(stage.querySelector(".card")?.offsetWidth||200)*.76;
stage.addEventListener("pointerdown",e=>{
  if(e.button||!shown.length)return;
  drag={x:e.clientX,t:tpos,m:false,v:0,lx:e.clientX,lt:e.timeStamp};
});
addEventListener("pointermove",e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x;
  if(!drag.m&&Math.abs(dx)>6){drag.m=true;stage.classList.add("drag");clearTimeout(snapT)}
  if(!drag.m)return;
  const dt=e.timeStamp-drag.lt;
  if(dt>0)drag.v=(e.clientX-drag.lx)/dt;
  drag.lx=e.clientX;drag.lt=e.timeStamp;
  tpos=clamp(drag.t-dx/sp(),0,shown.length-1);
  kick();
});
function release(e){
  if(!drag)return;
  const d=drag;drag=null;stage.classList.remove("drag");
  if(!d.m)return;
  swiped=true;setTimeout(()=>swiped=false,60);
  const v=e.timeStamp-d.lt>80?0:d.v;
  tpos=clamp(Math.round(tpos-v*220/sp()),0,shown.length-1);
  kick();
}
addEventListener("pointerup",release);
addEventListener("pointercancel",release);
stage.addEventListener("click",e=>{
  if(swiped){e.preventDefault();return}
  const c=e.target.closest(".card");
  if(!c)return;
  const i=els().indexOf(c);
  if(i!==cur()){e.preventDefault();tpos=i;kick()}
});
addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.querySelector("dialog[open]"))return;
  if(e.key==="ArrowLeft")go(-1);
  if(e.key==="ArrowRight")go(1);
});
q.addEventListener("input",()=>applyFilter());

/* Tombol */
$("#open").onclick=()=>{const d=shown[cur()];if(d&&safe(d.u)!=="#")window.open(safe(d.u),"_blank","noopener")};
const rst=()=>{const b=$("#del");b.dataset.sure="";b.querySelector("span").textContent="Hapus"};
$("#del").onclick=function(){
  const k=cur(),d=shown[k];
  if(!d)return;
  if(!this.dataset.sure){this.dataset.sure="1";this.querySelector("span").textContent="Yakin?";delT=setTimeout(rst,2200);return}
  clearTimeout(delT);rst();
  all=all.filter(x=>x.id!==d.id);save();
  applyFilter(Math.max(0,k-1));
};
function closeDlg(d){
  if(!d.open||d.classList.contains("out"))return;
  d.classList.add("out");
  setTimeout(()=>{d.classList.remove("out");d.close()},matchMedia("(prefers-reduced-motion:reduce)").matches?0:220);
}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeDlg(b.closest("dialog")));
document.querySelectorAll("dialog").forEach(d=>{
  d.addEventListener("click",e=>{if(e.target===d)closeDlg(d)});
  d.addEventListener("cancel",e=>{e.preventDefault();closeDlg(d)});
});

/* Auto: klik = buka semua link sebagai tab; klik kanan / tekan lama = atur link */
const dA=$("#dAuto"),rowsEl=$("#rows"),autoBtn=$("#auto");
const led=()=>autoBtn.classList.toggle("live",autoLinks.length>0);
const rowHTML=(v,i)=>`<tr><td>${i+1}</td><td><input class="f" value="${esc(v)}" placeholder="https://contoh.com" inputmode="url" autocomplete="off" aria-label="Link ${i+1}"></td><td><button type="button" class="rm" aria-label="Hapus baris">✕</button></td></tr>`;
const renum=()=>{if(!rowsEl.rows.length)rowsEl.innerHTML=rowHTML("",0);[...rowsEl.rows].forEach((r,i)=>r.cells[0].textContent=i+1)};
function openAuto(note){
  if(dA.open)return;
  rowsEl.innerHTML=(autoLinks.length?autoLinks:[""]).map(rowHTML).join("");
  $("#msgA").className="msg";
  $("#msgA").textContent=note||"Klik Auto untuk membuka semua link ini sebagai tab baru.";
  dA.showModal();
}
let pend=[],pT;
function runAuto(){
  if(lpFired){lpFired=false;return}
  if(!autoLinks.length)return openAuto("Belum ada link. Isi tabel ini lalu simpan.");
  const list=pend.length?pend:autoLinks;
  pend=[];
  list.forEach(u=>{const w=window.open(u,"_blank");if(w){try{w.opener=null}catch(_){}}else pend.push(u)});
  clearTimeout(pT);
  if(!pend.length)return toast(`${list.length} tab dibuka.`);
  pT=setTimeout(()=>pend=[],40000);
  toast(`${list.length-pend.length} tab terbuka, ${pend.length} diblokir browser. Klik Auto lagi untuk membuka sisanya, atau izinkan pop-up untuk situs ini agar semua terbuka sekaligus.`,1,9000);
}
autoBtn.onclick=runAuto;
autoBtn.addEventListener("contextmenu",e=>{e.preventDefault();openAuto()});
autoBtn.addEventListener("pointerdown",e=>{if(e.pointerType==="touch")lpT=setTimeout(()=>{lpFired=true;openAuto()},600)});
["pointerup","pointerleave","pointercancel"].forEach(t=>autoBtn.addEventListener(t,()=>clearTimeout(lpT)));
rowsEl.addEventListener("click",e=>{const b=e.target.closest(".rm");if(b){b.closest("tr").remove();renum()}});
$("#addRow").onclick=()=>{rowsEl.insertAdjacentHTML("beforeend",rowHTML("",rowsEl.rows.length));rowsEl.rows[rowsEl.rows.length-1].querySelector("input").focus()};
$("#fA").onsubmit=e=>{
  e.preventDefault();
  const out=[];let bad=null;
  rowsEl.querySelectorAll("input").forEach(inp=>{
    const v=normUrl(inp.value);
    if(v)out.push(v);else if(v===null&&!bad)bad=inp;
  });
  if(bad){const m=$("#msgA");m.textContent="Ada link yang tidak valid.";m.className="msg err";bad.focus();return}
  autoLinks=out;pend=[];wr(AK,out);led();closeDlg(dA);
  toast(out.length?`${out.length} link tersimpan untuk Auto.`:"Daftar link Auto dikosongkan.");
};

/* Tambah kartu */
const dAdd=$("#dAdd");let img="",thP=null;
const say=(t,err,el)=>{const m=$("#msg");m.textContent=t;m.classList.toggle("err",!!err);if(el)el.focus()};
$("#add").onclick=()=>{dAdd.showModal();$("#nm").focus()};
function setImg(src){
  img=src;$("#pv").src=src;$("#pv").hidden=false;$("#dt").hidden=true;
  thP=new Promise(res=>{
    const im=new Image();
    im.onload=()=>{let h=null;try{h=dominant(im)}catch(_){}if(h)$("#drop").style.borderColor=theme(h).c;res(h)};
    im.onerror=()=>res(null);
    im.src=src;
  });
  say("Gambar siap. Warna kartu mengikuti gambar ini.");
}
$("#file").onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  if(!f.type.startsWith("image/"))return say("File harus berupa gambar.",1);
  const r=new FileReader();
  r.onload=()=>{
    if(f.size<400e3)return setImg(r.result);
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      setImg(c.toDataURL("image/webp",.88));
    };
    im.onerror=()=>say("Gambar tidak bisa dibaca.",1);
    im.src=r.result;
  };
  r.readAsDataURL(f);
};
$("#form").onsubmit=async e=>{
  e.preventDefault();
  const n=$("#nm").value.trim(),u=normUrl($("#ln").value);
  if(!n)return say("Nama wajib diisi.",1,$("#nm"));
  if(u==="")return say("Link tujuan wajib diisi.",1,$("#ln"));
  if(u===null)return say("Link tidak valid.",1,$("#ln"));
  const h=img?await thP:null,th=theme(h||{h:hue(n),s:.85,l:.58});
  all.push({id:"c"+Date.now(),n,u,img,th,e:"🎴"});
  const ok=save(),idx=all.length-1;
  q.value="";setTimeout(()=>{applyFilter(idx);pos=Math.max(0,idx-1);kick()},matchMedia("(prefers-reduced-motion:reduce)").matches?0:240);
  e.target.reset();img="";thP=null;$("#pv").hidden=true;$("#dt").hidden=false;$("#drop").style.borderColor="";
  say("Warna kartu diambil dari gambar yang kamu pilih.");
  closeDlg(dAdd);
  toast(ok?"Kartu ditambahkan.":"Kartu ditambahkan, tapi gambarnya terlalu besar untuk disimpan permanen.",!ok);
};

led();applyFilter();
if(!matchMedia("(prefers-reduced-motion:reduce)").matches){pos=-2.2;kick()}
</script>
</body>
</html>
